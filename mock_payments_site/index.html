<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%223%22 fill=%22%23635bff%22/%3E%3C/svg%3E">
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <button class="account" type="button">
      <span class="account-logo" id="account-logo"></span>
      <span class="account-name" id="account-name"></span>
      <svg class="chev" viewBox="0 0 16 16"><path d="M4.5 6l3.5 3.5L11.5 6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <nav class="nav">
      <a href="#/" data-nav="home"><svg viewBox="0 0 16 16"><path d="M2.5 7.2 8 2.5l5.5 4.7V13a.5.5 0 0 1-.5.5H9.5V10h-3v3.5H3a.5.5 0 0 1-.5-.5Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>Home</a>
      <a href="#/balances" data-nav="balances"><svg viewBox="0 0 16 16"><rect x="2" y="3.5" width="12" height="9" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M2 6.5h12" stroke="currentColor" stroke-width="1.5"/></svg>Balances</a>
      <a href="#/payments" data-nav="payments"><svg viewBox="0 0 16 16"><path d="M2.5 5h9m0 0L9 2.5M11.5 5 9 7.5M13.5 11h-9m0 0L7 8.5M4.5 11 7 13.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>Transactions</a>
      <a href="#/customers" data-nav="customers"><svg viewBox="0 0 16 16"><circle cx="8" cy="5.5" r="2.75" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M2.75 13.5c.6-2.6 2.7-4 5.25-4s4.65 1.4 5.25 4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>Customers</a>
      <a href="#/products" data-nav="products"><svg viewBox="0 0 16 16"><path d="M8 2 13.5 5v6L8 14l-5.5-3V5Zm0 0v12M2.5 5 8 8l5.5-3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>Product catalog</a>
      <div class="nav-label" data-i18n="shortcuts">Shortcuts</div>
      <a href="#/payments" data-nav="payments-shortcut"><svg viewBox="0 0 16 16"><path d="M8 3.5V8l3 1.75" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>Payments</a>
      <a href="#/invoices" data-nav="invoices"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 3.5V8l3 1.75" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>Invoices</a>
      <a href="#/payment-links" data-nav="links"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 3.5V8l3 1.75" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>Payment Links</a>
      <div class="nav-label" data-i18n="productsLabel">Products</div>
      <a href="#/connect" data-nav="connect"><svg viewBox="0 0 16 16"><circle cx="4.5" cy="8" r="2" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="11.5" cy="4" r="2" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="11.5" cy="12" r="2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="m6.3 7 3.4-2m-3.4 4 3.4 2" stroke="currentColor" stroke-width="1.5"/></svg>Connect<svg class="chev-r" viewBox="0 0 16 16"><path d="m6 4 4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></a>
      <a href="#/payments-product" data-nav="payments-product"><svg viewBox="0 0 16 16"><rect x="1.75" y="3.5" width="12.5" height="9" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M1.75 6.5h12.5M4.5 10h2" stroke="currentColor" stroke-width="1.5"/></svg>Payments<svg class="chev-r" viewBox="0 0 16 16"><path d="m6 4 4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></a>
      <a href="#/billing" data-nav="billing"><svg viewBox="0 0 16 16"><path d="M3.5 2h9v12l-2-1.25L8.5 14l-2-1.25L4.5 14l-1-.6Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M6 5.5h4M6 8.5h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>Billing<svg class="chev-r" viewBox="0 0 16 16"><path d="m6 4 4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></a>
      <a href="#/reporting" data-nav="reporting"><svg viewBox="0 0 16 16"><path d="M2.5 13.5h11M4.5 11V7.5M8 11V4m3.5 7V6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>Reporting<svg class="chev-r" viewBox="0 0 16 16"><path d="m6 4 4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></a>
      <a href="#/more" data-nav="more"><svg viewBox="0 0 16 16"><circle cx="3.5" cy="8" r="1.25" fill="currentColor"/><circle cx="8" cy="8" r="1.25" fill="currentColor"/><circle cx="12.5" cy="8" r="1.25" fill="currentColor"/></svg>More<svg class="chev-r" viewBox="0 0 16 16"><path d="m6 4 4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></a>
    </nav>
    <div class="sidebar-foot"><a href="#/developers" data-nav="developers"><svg viewBox="0 0 16 16"><path d="m5.5 4.5-3.5 3.5 3.5 3.5m5-7 3.5 3.5-3.5 3.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>Developers</a></div>
  </aside>
  <div class="main">
    <header class="topbar">
      <label class="search"><svg viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.75" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="m10.5 10.5 3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><input id="search" placeholder="Search" autocomplete="off"></label>
      <h1 id="company"></h1>
      <div class="top-icons">
        <button type="button" title="Apps"><svg viewBox="0 0 16 16"><g fill="currentColor"><rect x="2" y="2" width="3" height="3" rx=".75"/><rect x="6.5" y="2" width="3" height="3" rx=".75"/><rect x="11" y="2" width="3" height="3" rx=".75"/><rect x="2" y="6.5" width="3" height="3" rx=".75"/><rect x="6.5" y="6.5" width="3" height="3" rx=".75"/><rect x="11" y="6.5" width="3" height="3" rx=".75"/><rect x="2" y="11" width="3" height="3" rx=".75"/><rect x="6.5" y="11" width="3" height="3" rx=".75"/><rect x="11" y="11" width="3" height="3" rx=".75"/></g></svg></button>
        <button type="button" title="Help"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.25" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M6.2 6.3a1.9 1.9 0 0 1 3.7.4c0 1.3-1.9 1.6-1.9 2.8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="8" cy="11.6" r=".9" fill="currentColor"/></svg></button>
        <button type="button" title="Notifications"><svg viewBox="0 0 16 16"><path d="M4 11.5V7a4 4 0 0 1 8 0v4.5l1.25 1H2.75Zm2.5 2.25a1.5 1.5 0 0 0 3 0" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg></button>
        <button type="button" title="Settings"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 1.75v1.5m0 9.5v1.5M1.75 8h1.5m9.5 0h1.5M3.6 3.6l1.05 1.05m6.7 6.7 1.05 1.05m0-8.8-1.05 1.05m-6.7 6.7L3.6 12.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
        <button type="button" class="create" title="Create"><svg viewBox="0 0 16 16"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></svg></button>
      </div>
    </header>
    <main id="view" class="view"></main>
  </div>
</div>
<div id="tooltip" class="tooltip" hidden></div>
<script type="module" src="app.js"></script>
</body>
</html>
